name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2
      - name: Unzip project
        run: unzip -o CleanLauncher.zip
      - name: Build
        run: |
          cd CleanLauncher
          gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: CleanLauncher-apk
          path: CleanLauncher/app/build/outputs/apk/debug/app-debug.apk
